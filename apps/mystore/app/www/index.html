<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStore 应用商城</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --border: #e8eaed; --text: #1a1a1a;
    --dim: #6b7280; --primary: #2f6bff; --primary-hover: #1f5bf0; --soft: #eaf1ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,.9); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; padding: 12px 22px;
  }
  .logo { display:flex; align-items:center; gap:9px; font-weight:700; font-size:17px; }
  .logo .mark {
    width:28px; height:28px; border-radius:8px; color:#fff; font-size:14px;
    background:linear-gradient(135deg,#2f6bff,#5b8cff);
    display:flex; align-items:center; justify-content:center;
  }
  .search { position:relative; flex:1; max-width:380px; }
  .search input {
    width:100%; padding:9px 12px 9px 36px; border-radius:9px; font-size:13.5px;
    border:1px solid var(--border); background:#fafbfc; outline:none;
  }
  .search input:focus { border-color:var(--primary); background:#fff; }
  .search svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.4; }
  .layout { max-width:1080px; margin:0 auto; padding:20px 22px 50px; }
  .cats { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .chip {
    padding:7px 15px; border-radius:18px; font-size:13px; cursor:pointer;
    background:#fff; border:1px solid var(--border); color:var(--dim); user-select:none;
  }
  .chip.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:15px; }
  .app {
    background:var(--panel); border:1px solid var(--border); border-radius:13px;
    padding:16px; display:flex; flex-direction:column; gap:11px; transition:all .15s;
  }
  .app:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.08); }
  .app-top { display:flex; gap:12px; align-items:center; }
  .app-icon { width:50px; height:50px; border-radius:12px; background:#eef0f3; border:1px solid var(--border); }
  .app-name { font-size:15px; font-weight:700; }
  .app-sub { font-size:11.5px; color:var(--dim); margin-top:2px; }
  .app-desc {
    font-size:12.5px; color:var(--dim); line-height:1.55; min-height:36px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .app-foot { display:flex; align-items:center; margin-top:auto; }
  .ver { font-size:11.5px; color:var(--dim); margin-right:auto; }
  .install {
    background:var(--primary); color:#fff; text-decoration:none; border-radius:8px;
    padding:7px 16px; font-size:13px; font-weight:600; cursor:pointer; border:none;
  }
  .install:hover { background:var(--primary-hover); }
  .tip {
    background:var(--soft); border:1px solid #c9dbff; color:#274a8f;
    border-radius:10px; padding:10px 14px; font-size:12.5px; margin-bottom:16px; line-height:1.6;
  }
  .empty { text-align:center; color:var(--dim); padding:60px 0; }
  .toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#1a1a1a; color:#fff; padding:9px 18px; border-radius:9px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><span class="mark">M</span>MyStore 应用商城</div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" placeholder="搜索应用" oninput="render()">
  </div>
</div>

<div class="layout">
  <div class="tip">
    📦 点击「下载 .fpk」获取安装包，然后到 <b>飞牛应用中心 → 手动安装</b> 上传即可。
  </div>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的应用</div>
</div>
<div class="toast" id="toast"></div>

<script>
const DATA_URL = 'https://jiankujidu.github.io/mystore.github.io/fnpack.json';
let DATA = null, activeCat = '全部';

async function load() {
  try { DATA = await (await fetch(DATA_URL, {cache:'no-cache'})).json(); }
  catch(e) { document.getElementById('grid').innerHTML = '<div class="empty">无法加载应用源，请检查网络</div>'; return; }
  buildCats(); render();
}
function buildCats() {
  const set = ['全部'];
  Object.values(DATA.apps||{}).forEach(a => (a.categories||[]).forEach(c => { if(!set.includes(c)) set.push(c); }));
  document.getElementById('cats').innerHTML = set.map(c =>
    `<div class="chip ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</div>`).join('');
}
function setCat(c) { activeCat = c; buildCats(); render(); }
function render() {
  const q = (document.getElementById('q').value||'').toLowerCase();
  const apps = Object.entries(DATA.apps||{}).filter(([n,a]) => {
    const okC = activeCat==='全部' || (a.categories||[]).includes(activeCat);
    const okQ = !q || (a.display_name||'').toLowerCase().includes(q) || (a.desc||'').toLowerCase().includes(q);
    return okC && okQ;
  });
  document.getElementById('empty').style.display = apps.length ? 'none':'block';
  document.getElementById('grid').innerHTML = apps.map(([name,a]) => {
    const ver = Object.keys(a.releases||{})[0]||'';
    const pkg = (a.releases?.[ver]?.packages?.all) || Object.values(a.releases?.[ver]?.packages||{})[0] || {};
    const icon = a.icon_url ? 'https://jiankujidu.github.io/mystore.github.io/' + a.icon_url.replace(/^\//,'') : '';
    return `
    <div class="app">
      <div class="app-top">
        <img class="app-icon" src="${icon}" onerror="this.style.visibility='hidden'">
        <div>
          <div class="app-name">${a.display_name||name}</div>
          <div class="app-sub">v${ver} · ${(a.platform||[]).join('/')}</div>
        </div>
      </div>
      <div class="app-desc">${a.desc||''}</div>
      <div class="app-foot">
        <span class="ver">${(a.categories||[]).join(' / ')}</span>
        <a class="install" href="${pkg.download_url||'#'}" target="_blank" rel="noopener">下载 .fpk</a>
      </div>
    </div>`;
  }).join('');
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Hello飞牛</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px 56px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 480px;
        }
        .logo {
            width: 72px;
            height: 72px;
            background: rgba(255,255,255,0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
        }
        h1 { font-size: 28px; margin-bottom: 8px; font-weight: 600; }
        p { font-size: 15px; opacity: 0.85; line-height: 1.7; margin-bottom: 24px; }
        .meta {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🐮</div>
        <h1>Hello飞牛</h1>
        <p>这是你的第一个飞牛 fnOS 应用。<br>基于 fnpack 构建，支持静态页面分发。</p>
        <div class="meta">appname: hello-fn · version: 1.0.0</div>
    </div>
</body>
</html>

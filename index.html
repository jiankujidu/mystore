<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStore · 应用中心</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e8eaed;
    --text: #1a1a1a;
    --text-dim: #6b7280;
    --primary: #2f6bff;
    --primary-hover: #1f5bf0;
    --primary-soft: #eaf1ff;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.6; min-height: 100vh;
  }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 1180px; margin: 0 auto; padding: 12px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  .logo {
    display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px;
  }
  .logo .mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, #2f6bff, #5b8cff);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px;
  }
  .search {
    flex: 1; position: relative; max-width: 420px;
  }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: .4; }
  .search input {
    width: 100%; padding: 9px 14px 9px 38px; border-radius: 9px;
    border: 1px solid var(--border); background: #fafbfc; color: var(--text);
    font-size: 14px; outline: none; transition: border-color .15s;
  }
  .search input:focus { border-color: var(--primary); background: #fff; }
  .top-actions { margin-left: auto; display: flex; gap: 8px; }
  .mini-btn {
    border: 1px solid var(--border); background: #fff; color: var(--text-dim);
    border-radius: 8px; padding: 7px 12px; font-size: 12.5px; cursor: pointer;
    white-space: nowrap; transition: all .15s;
  }
  .mini-btn:hover { color: var(--text); border-color: #cfd3da; }
  .mini-btn.copied { color: var(--primary); border-color: var(--primary); }

  /* Layout */
  .layout { max-width: 1180px; margin: 0 auto; padding: 24px; display: flex; gap: 24px; }
  .sidebar {
    width: 184px; flex-shrink: 0; position: sticky; top: 72px; align-self: flex-start;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px; box-shadow: var(--shadow);
  }
  .side-title { font-size: 12px; color: var(--text-dim); padding: 8px 10px 6px; font-weight: 600; }
  .cat-item {
    display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-radius: 9px;
    font-size: 14px; color: var(--text); cursor: pointer; transition: all .12s; user-select: none;
  }
  .cat-item:hover { background: #f3f4f6; }
  .cat-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .cat-item .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .55; }

  .main { flex: 1; min-width: 0; }
  .main-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
  .main-head h2 { font-size: 17px; font-weight: 700; }
  .main-head .count { font-size: 13px; color: var(--text-dim); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .app {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; display: flex; flex-direction: column; gap: 12px;
    transition: transform .15s, box-shadow .15s, border-color .15s; box-shadow: var(--shadow);
  }
  .app:hover { transform: translateY(-3px); border-color: #cfd6e4; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
  .app-top { display: flex; gap: 13px; align-items: center; }
  .app-icon {
    width: 54px; height: 54px; border-radius: 13px; flex-shrink: 0; object-fit: cover;
    background: #eef0f3; border: 1px solid var(--border);
  }
  .app-name { font-size: 15.5px; font-weight: 700; }
  .app-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .app-desc {
    font-size: 13px; color: var(--text-dim); line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 38px;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11px; padding: 3px 9px; border-radius: 6px;
    background: #f0f2f5; color: #5a6472;
  }
  .app-foot { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 4px; }
  .ver { font-size: 12px; color: var(--text-dim); margin-right: auto; }
  .install {
    background: var(--primary); color: #fff; border: none; border-radius: 9px;
    padding: 8px 18px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: background .15s;
  }
  .install:hover { background: var(--primary-hover); }

  .empty { text-align: center; color: var(--text-dim); padding: 70px 0; font-size: 15px; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1a1a1a; color: #fff; padding: 11px 22px; border-radius: 10px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; position: static; display: flex; gap: 6px; overflow-x: auto; }
    .side-title { display: none; }
    .cat-item { white-space: nowrap; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="logo"><span class="mark">M</span> MyStore</div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="搜索应用" oninput="render()">
    </div>
    <div class="top-actions">
      <button class="mini-btn" id="btnSrc" onclick="copySource()">复制源地址</button>
      <button class="mini-btn" id="btnPage" onclick="copyPage()">收藏本页</button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="side-title">分类</div>
    <div id="cats"></div>
  </aside>

  <main class="main">
    <div class="main-head">
      <h2 id="catTitle">全部应用</h2>
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">没有匹配的应用</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const SOURCE_URL = location.origin + location.pathname.replace(/index\.html$/, '') + 'fnpack.json';
let DATA = null;
let activeCat = '全部';

async function load() {
  try {
    DATA = await (await fetch('fnpack.json', { cache: 'no-cache' })).json();
  } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="empty">无法加载 fnpack.json</div>';
    return;
  }
  const si = DATA.source_info || {};
  document.getElementById('catTitle').textContent = si.name || 'MyStore';
  buildCats();
  render();
}

function buildCats() {
  const set = ['全部'];
  Object.values(DATA.apps || {}).forEach(a => (a.categories || []).forEach(c => { if (!set.includes(c)) set.push(c); }));
  const el = document.getElementById('cats');
  el.innerHTML = set.map(c =>
    `<div class="cat-item ${c===activeCat?'active':''}" onclick="setCat('${c}')"><span class="dot"></span>${c}</div>`
  ).join('');
}
function setCat(c) { activeCat = c; buildCats(); render(); }

function render() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  const apps = Object.entries(DATA.apps || {}).filter(([name, a]) => {
    const okCat = activeCat === '全部' || (a.categories || []).includes(activeCat);
    const okQ = !q || (a.display_name||'').toLowerCase().includes(q) ||
                (a.desc||'').toLowerCase().includes(q) || name.toLowerCase().includes(q);
    return okCat && okQ;
  });
  document.getElementById('catTitle').textContent = activeCat;
  document.getElementById('count').textContent = apps.length ? apps.length + ' 个应用' : '';
  document.getElementById('empty').style.display = apps.length ? 'none' : 'block';
  document.getElementById('grid').innerHTML = apps.map(([name, a]) => {
    const ver = Object.keys(a.releases || {})[0] || '';
    const pkg = (a.releases?.[ver]?.packages?.all) || Object.values(a.releases?.[ver]?.packages || {})[0] || {};
    const icon = a.icon_url || 'icons/' + name + '/icon.png';
    const tags = (a.categories || []).map(c => `<span class="tag">${c}</span>`).join('');
    return `
    <div class="app">
      <div class="app-top">
        <img class="app-icon" src="${icon}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2254%22 height=%2254%22%3E%3Crect width=%2254%22 height=%2254%22 rx=%2213%22 fill=%22%23eef0f3%22/%3E%3Ctext x=%2227%22 y=%2234%22 font-size=%2218%22 fill=%22%239aa0a6%22 text-anchor=%22middle%22%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E'">
        <div>
          <div class="app-name">${a.display_name || name}</div>
          <div class="app-sub">${a.maintainer ? 'by ' + a.maintainer : (a.platform||[]).join('/')}</div>
        </div>
      </div>
      <div class="app-desc">${a.desc || ''}</div>
      <div class="tags">${tags}</div>
      <div class="app-foot">
        <span class="ver">v${ver}</span>
        <a class="install" href="${pkg.download_url || '#'}" download>安装</a>
      </div>
    </div>`;
  }).join('');
}

function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }
function flash(btn) { const t = btn.textContent; btn.classList.add('copied'); btn.textContent = '已复制'; setTimeout(() => { btn.classList.remove('copied'); btn.textContent = t; }, 1500); }
async function copySource() { await navigator.clipboard.writeText(SOURCE_URL); toast('已复制源地址'); flash(document.getElementById('btnSrc')); }
async function copyPage() { await navigator.clipboard.writeText(location.href); toast('已复制本页地址'); flash(document.getElementById('btnPage')); }

load();
</script>
</body>
</html>

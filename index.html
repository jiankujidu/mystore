<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的飞牛应用商店</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-hover: #22262f;
    --accent: #4f8cff;
    --accent-2: #6f6cff;
    --text: #e8eaed;
    --text-dim: #9aa0a6;
    --border: #2a2e37;
    --green: #2ecc71;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }

  /* Header */
  header {
    padding: 48px 0 32px;
    text-align: center;
    background: radial-gradient(circle at 50% 0%, rgba(79,140,255,0.18), transparent 60%);
  }
  header h1 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header .sub { color: var(--text-dim); margin-top: 8px; font-size: 14px; }
  header .author { color: var(--accent); font-size: 13px; margin-top: 4px; }

  /* Source bar */
  .source-bar {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    margin: 22px auto 0; max-width: 640px;
  }
  .source-bar code {
    flex: 1; min-width: 240px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; font-size: 12.5px;
    color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .btn {
    border: none; cursor: pointer; border-radius: 8px;
    padding: 10px 18px; font-size: 13px; font-weight: 600;
    transition: transform .1s, filter .15s; white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; }
  .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn:hover { filter: brightness(1.1); }

  /* Controls */
  .controls {
    display: flex; gap: 12px; margin: 32px 0 24px; flex-wrap: wrap; align-items: center;
  }
  .search {
    flex: 1; min-width: 200px; position: relative;
  }
  .search input {
    width: 100%; padding: 11px 14px 11px 38px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 14px; outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: .5; }
  .cats { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 7px 14px; border-radius: 20px; font-size: 12.5px; cursor: pointer;
    background: var(--card); border: 1px solid var(--border); color: var(--text-dim);
    transition: all .15s; user-select: none;
  }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Grid */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
  }
  .app {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; display: flex; flex-direction: column; gap: 12px;
    transition: border-color .15s, transform .15s, background .15s;
  }
  .app:hover { border-color: var(--accent); transform: translateY(-3px); background: var(--card-hover); }
  .app-head { display: flex; gap: 14px; align-items: flex-start; }
  .app-icon {
    width: 56px; height: 56px; border-radius: 13px; flex-shrink: 0;
    object-fit: cover; background: #2a2e37; border: 1px solid var(--border);
  }
  .app-title { font-size: 16px; font-weight: 700; }
  .app-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; }
  .app-desc { font-size: 13.5px; color: var(--text-dim); line-height: 1.55; flex: 1; }
  .tag {
    display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 6px;
    background: rgba(79,140,255,0.15); color: var(--accent); margin: 0 6px 6px 0;
  }
  .app-foot { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
  .ver { font-size: 11.5px; color: var(--text-dim); margin-right: auto; }
  .download { background: var(--green); color: #08130c; }
  .download:hover { filter: brightness(1.08); }

  .empty { text-align: center; color: var(--text-dim); padding: 60px 0; font-size: 15px; }
  footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 50px; }
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--green); color: #08130c; padding: 11px 22px; border-radius: 10px;
    font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding-bottom:0">
    <h1 id="storeName">MyStore</h1>
    <div class="sub" id="storeDesc">自托管 fnOS 应用分发源 · 支持 FnDepot 客户端</div>
    <div class="author" id="storeAuthor"></div>
    <div class="source-bar">
      <code id="srcUrl">加载中…</code>
      <button class="btn btn-primary" onclick="copySource()">复制源地址</button>
      <button class="btn btn-ghost" onclick="copyAll()">复制全部应用</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="搜索应用…" oninput="render()">
    </div>
  </div>
  <div class="cats" id="cats"></div>

  <div class="grid" id="grid" style="margin-top:18px"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的应用</div>
</div>

<footer>
  <div class="wrap" style="padding:0">
    安装方式：下载 .fpk → 飞牛应用中心 → 手动安装；或在 FnDepot 客户端粘贴上方源地址。
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
const SOURCE_URL = location.origin + location.pathname.replace(/index\.html$/, '') + 'fnpack.json';
let DATA = null;
let activeCat = '全部';

async function load() {
  try {
    const res = await fetch('fnpack.json', { cache: 'no-cache' });
    DATA = await res.json();
  } catch (e) {
    document.getElementById('grid').innerHTML =
      '<div class="empty">无法加载 fnpack.json，请确认仓库已正确部署。</div>';
    return;
  }
  document.getElementById('srcUrl').textContent = SOURCE_URL;
  const si = DATA.source_info || {};
  document.getElementById('storeName').textContent = si.name || 'MyStore';
  if (si.description) document.getElementById('storeDesc').textContent = si.description;
  if (si.author) document.getElementById('storeAuthor').textContent = '维护者：' + si.author;
  buildCats();
  render();
}

function buildCats() {
  const set = new Set(['全部']);
  Object.values(DATA.apps || {}).forEach(a => (a.categories || []).forEach(c => set.add(c)));
  const el = document.getElementById('cats');
  el.innerHTML = '';
  [...set].forEach(c => {
    const d = document.createElement('div');
    d.className = 'chip' + (c === activeCat ? ' active' : '');
    d.textContent = c;
    d.onclick = () => { activeCat = c; buildCats(); render(); };
    el.appendChild(d);
  });
}

function render() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  const grid = document.getElementById('grid');
  const apps = Object.entries(DATA.apps || {}).filter(([name, a]) => {
    const okCat = activeCat === '全部' || (a.categories || []).includes(activeCat);
    const okQ = !q || (a.display_name || '').toLowerCase().includes(q) ||
                (a.desc || '').toLowerCase().includes(q) || name.toLowerCase().includes(q);
    return okCat && okQ;
  });
  document.getElementById('empty').style.display = apps.length ? 'none' : 'block';
  grid.innerHTML = apps.map(([name, a]) => {
    const ver = Object.keys(a.releases || {})[0] || '';
    const pkg = (a.releases?.[ver]?.packages?.all) || Object.values(a.releases?.[ver]?.packages || {})[0] || {};
    const icon = a.icon_url || ((DATA.__base || '') + 'icons/' + name + '/icon.png');
    const tags = (a.categories || []).map(c => `<span class="tag">${c}</span>`).join('');
    return `
    <div class="app">
      <div class="app-head">
        <img class="app-icon" src="${icon}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2256%22 height=%2256%22%3E%3Crect width=%2256%22 height=%2256%22 rx=%2213%22 fill=%22%232a2e37%22/%3E%3Ctext x=%2228%22 y=%2234%22 font-size=%2220%22 fill=%22%239aa0a6%22 text-anchor=%22middle%22%3E📦%3C/text%3E%3C/svg%3E'">
        <div>
          <div class="app-title">${a.display_name || name}</div>
          <div class="app-meta">${a.maintainer ? 'by ' + a.maintainer + ' · ' : ''}${(a.platform||[]).join('/')}</div>
        </div>
      </div>
      <div class="app-desc">${a.desc || ''}</div>
      <div>${tags}</div>
      <div class="app-foot">
        <span class="ver">v${ver}</span>
        <a class="btn download" href="${pkg.download_url || '#'}" download>下载 .fpk</a>
      </div>
    </div>`;
  }).join('');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
function copySource() {
  navigator.clipboard.writeText(SOURCE_URL).then(() => toast('已复制源地址'));
}
function copyAll() {
  const lines = Object.entries(DATA.apps || {}).map(([n, a]) => {
    const v = Object.keys(a.releases||{})[0]||'';
    const p = Object.values(a.releases?.[v]?.packages||{})[0]||{};
    return a.display_name + ' | ' + (p.download_url||'');
  }).join('\n');
  navigator.clipboard.writeText(lines).then(() => toast('已复制全部下载链接'));
}

load();
</script>
</body>
</html>
